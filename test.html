<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript テスト課題</title>

    <!-- 見た目を設定するCSSファイルを読み込む -->
    <link rel="stylesheet" href="style.css">

    <!-- ボタンの動作を設定するJavaScriptファイルを読み込む -->
    <script src="style.js" defer></script>
</head>

<body>
    <main class="app">
        <!-- 設問2：ページ全体の背景色を変更するボタン -->
        <button id="backgroundButton" type="button">背景色を変更</button>

        <!-- 設問1・3・4：文字入力、表示、テーブルへの追加 -->
        <div class="inputArea">
            <input id="textInput" type="text" aria-label="テキスト入力欄">
            <button id="displayButton" type="button">表示</button>
            <button id="addButton" type="button">追加</button>
        </div>

        <!-- 設問1・3：入力した文字を表示する場所 -->
        <div id="textDisplay" class="textDisplay" aria-live="polite">表示エリア</div>

        <!-- 設問4・5・6：現在の行数 -->
        <p id="rowCount">現在の行数: 0 件</p>

        <!-- 設問4・5・6：データテーブル -->
        <table>
            <thead>
                <tr>
                    <th scope="col">内容</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- ここに行を追加する -->
            </tbody>
        </table>
    </main>
</body>

</html>
